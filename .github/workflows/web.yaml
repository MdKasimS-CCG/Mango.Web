name: Mango.Web CI/CD

on:
  push:
    branches:
      - 'feature/*'
      - main

  pull_request:
    branches:
      - main
    types: 
     - opened
     - synchronize
     - reopened

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true

      # 3. Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore Mango.Web.csproj

      # 4. Build application
      - name: Build
        run: |
          dotnet build Mango.Web.csproj \
            --configuration Release \
            --no-restore

      # 5. No automated tests currently exist
      - name: Test
        run: |
          echo "No test project exists for Mango.Web."
          echo "Skipping automated tests."

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag ghcr.io/mdkasims-ccg/mango-web:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}  \
            --load \
            --cache-from type=gha \ 
            --cache-to type=gha,mode=max \
            .

      # 8. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Push Docker image to GHCR
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ghcr.io/mdkasims-ccg/mango-web:${{ github.sha }}
